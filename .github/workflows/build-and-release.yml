name: Build & Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package & Publish
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for plat in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            PKG_DIR="sparta-${VERSION}"
            mkdir -p "$PKG_DIR"
            cp -r .opencode "$PKG_DIR/"
            cp -r themes "$PKG_DIR/" 2>/dev/null || true
            cp -r skills "$PKG_DIR/" 2>/dev/null || true
            cp -r specs "$PKG_DIR/" 2>/dev/null || true
            cp scripts/install.ps1 "$PKG_DIR/"
            cp scripts/install.sh "$PKG_DIR/"
            cp README.md LICENSE "$PKG_DIR/" 2>/dev/null || true
            tar -czf "sparta-${VERSION}-${plat}.tar.gz" "$PKG_DIR"
            rm -rf "$PKG_DIR"
          done

          gh release create "v$VERSION" \
            --repo Kenzioda/sparta-ai \
            --title "S.P.A.R.T.A v$VERSION" \
            --generate-notes || true
          gh release upload "v$VERSION" sparta-*.tar.gz \
            --repo Kenzioda/sparta-ai --clobber
